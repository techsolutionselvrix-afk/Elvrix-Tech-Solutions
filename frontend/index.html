    />
    <script>
      (function () {
        try {
          var hour = Number(
            new Intl.DateTimeFormat("en-GB", {
              timeZone: "Asia/Kolkata",
              hour: "numeric",
              hour12: false,
            }).format(new Date()),
          );
          if (hour === 24) hour = 0;
          var theme = hour >= 6 && hour < 18 ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
