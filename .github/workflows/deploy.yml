name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Triggers deployment when you push to the main branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build project
        working-directory: ./frontend
        run: npm run build

      # Pre-render static entry files for each client-side route so that
      # GitHub Pages returns HTTP 200 (not 404) for deep links. This is
      # required for Google Search Console indexing — the 404.html SPA
      # fallback trick boots the app but still returns a 404 status code,
      # which Google treats as "page not found" and refuses to index.
      - name: Handle SPA Routing
        working-directory: ./frontend
        run: |
          cp dist/index.html dist/404.html
          for route in service about blog work contact terms privacy-policy; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
